[GAME]
profile = diablo4

[CAPTURE]
output_idx = 0
mode = window
window_titles =
fallback_to_screen = false

[QWEN_VL]
endpoint = http://127.0.0.1:8082/v1/chat/completions
model = Qwen3-VL-2B-Instruct
interval = 1.0
timeout = 45
max_tokens = 4096
image_width = 768
jpeg_quality = 72

[AGENT]
hud_mode = true
console_enabled = true
reaction_interval = 0.05
capture_fps = 60
hud_interval = 0.2
intent_interval = 1.0
intent_cache_ttl = 3.0
min_intent_confidence = 0.60
hud_retry_interval = 5.0

[INPUT]
backend = esp32_ble

[LOG]
level = INFO
summary_interval = 2.0

[PROFILE_CHAT]
max_tokens = 4096
timeout = 120

[ESP32]
port = COM3
baudrate = 115200
timeout = 0.7
